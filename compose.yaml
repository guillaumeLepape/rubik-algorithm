services:
  rubik-algorithm:
    image: lscr.io/linuxserver/nginx:1.30.6@sha256:c139c9132e4fe37aa9d1f418b483355f44eed69d5012214e0dd73978bb9c2145
    container_name: rubik-algorithm
    restart: unless-stopped
    environment:
      - PUID=950
      - PGID=950
      - TZ=Europe/Paris
    volumes:
      - ./site:/config/www:ro
    ports:
      - "4000:80"
    tmpfs:
      - /run:exec
      - /tmp
    read_only: true
