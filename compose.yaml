services:
  rubik-algorithm:
    image: lscr.io/linuxserver/nginx:1.30.6@sha256:8de00c2dd6d2d00955a2905909577986660c9c654050865de9f895b0ad97a9fa
    container_name: rubik-algorithm
    restart: unless-stopped
    environment:
      - PUID=${PUID:?error}
      - PGID=${PGID:?error}
      - TZ=Europe/Paris
    volumes:
      - ./site:/config/www:ro
    ports:
      - "4000:80"
    tmpfs:
      - /run:exec
      - /tmp
    read_only: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
