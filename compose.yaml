services:
  rubik-algorithm:
    image: lscr.io/linuxserver/nginx:1.30.7@sha256:3bd455381c04aaf93efb72be9028ca3a82886251e4ba35c793ee1b06dc2a7cd0
    container_name: rubik-algorithm
    restart: unless-stopped
    environment:
      - PUID=${PUID:?error}
      - PGID=${PGID:?error}
      - TZ=Europe/Paris
    volumes:
      - ./site:/config/www:ro
    ports:
      - "4000:80"
    tmpfs:
      - /run:exec
      - /tmp
    read_only: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
