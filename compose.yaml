services:
  rubik-algorithm:
    image: lscr.io/linuxserver/nginx:1.30.7@sha256:fd515331fc6686b43a5a189649009d54e60b9d6079d1aa4d450c02cf25c69ca5
    container_name: rubik-algorithm
    restart: unless-stopped
    environment:
      - PUID=${PUID:?error}
      - PGID=${PGID:?error}
      - TZ=Europe/Paris
    volumes:
      - ./site:/config/www:ro
    ports:
      - "4000:80"
    tmpfs:
      - /run:exec
      - /tmp
    read_only: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
