services:
  rubik-algorithm:
    image: lscr.io/linuxserver/nginx:1.30.8@sha256:0b57538c31292eb86ad19e7e4212ea105052b00342d63c069abdde8f3e0c8e57
    container_name: rubik-algorithm
    restart: unless-stopped
    environment:
      - PUID=${PUID:?error}
      - PGID=${PGID:?error}
      - TZ=Europe/Paris
    volumes:
      - ./site:/config/www:ro
    ports:
      - "4000:80"
    tmpfs:
      - /run:exec
      - /tmp
    read_only: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
