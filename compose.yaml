services:
  rubik-algorithm:
    image: lscr.io/linuxserver/nginx:1.30.6@sha256:ed84137217161f6a830fb1b883fcc70f0eaeef717c16ac2d796662b8c66f4340
    container_name: rubik-algorithm
    restart: unless-stopped
    environment:
      - PUID=950
      - PGID=950
      - TZ=Europe/Paris
    volumes:
      - ./site:/config/www:ro
    ports:
      - "4000:80"
    tmpfs:
      - /run:exec
      - /tmp
    read_only: true
