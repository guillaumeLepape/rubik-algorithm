services:
  rubik-algorithm:
    image: lscr.io/linuxserver/nginx:1.30.4@sha256:c6c300bd5959e340d8742359f59604f3ad21426ea905cc77e75b01345034c8c6
    container_name: rubik-algorithm
    restart: unless-stopped
    environment:
      - PUID=950
      - PGID=950
      - TZ=Europe/Paris
    volumes:
      - ./site:/config/www:ro
    ports:
      - "4000:80"
    tmpfs:
      - /run:exec
      - /tmp
    read_only: true
