services:
  rubik-algorithm:
    image: lscr.io/linuxserver/nginx:1.30.6@sha256:112b962104600d925ea4c62875e138dc0b0cb27ff91a6f8ae40b9db90e21ec5e
    container_name: rubik-algorithm
    restart: unless-stopped
    environment:
      - PUID=${PUID:?error}
      - PGID=${PGID:?error}
      - TZ=Europe/Paris
    volumes:
      - ./site:/config/www:ro
    ports:
      - "4000:80"
    tmpfs:
      - /run:exec
      - /tmp
    read_only: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
