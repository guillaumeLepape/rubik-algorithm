name: 📦 Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: 3.13
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: sudo apt install -y pngquant

      - name: Install python dependencies
        run: uv sync --all-extras

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Build website
        run: uv run mkdocs build

      - name: Deploy to release/main
        run: |-
          # Create worktree for release
          git fetch origin
          git worktree add /tmp/release origin/release/main

          # Clean previous contents
          rm -rf /tmp/release/*

          # Copy new build
          cp -r site /tmp/release/
          cp compose.yaml /tmp/release/

          cd /tmp/release

          git add .
          git commit -m "Update site" || echo "No changes to commit"
          git push origin HEAD:release/main
