[build-system]
requires = ["hatchling ==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "rubik-algorithm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mkdocs-macros-plugin==1.5.0",
    "mkdocs-material==9.8.0",
    "mkdocs-site-urls==0.3.1",
    "numpy==2.5.4",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "prek==0.5.7",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 100
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "PT", "UP"]

[tool.mypy]
strict = true
pretty = true
